[project]
name = "pacer"
version = "0.1.0"
description = "Session-aware learned eviction for LLM prefix KV caches, tested on production traces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joshua Bugarin", email = "jbugarin85424@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
]

[project.optional-dependencies]
live = [
    "mlx==0.32.4 ; sys_platform == 'darwin'",
    "mlx-lm==0.32.2 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/pacer-py/Cargo.toml"
python-source = "python"
module-name = "pacer._core"
profile = "release"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running checks on full traces",
    "live: needs MLX on Apple silicon and a downloaded model",
]
addopts = "-ra"
