[package]
name = "pacer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Trace-driven LLM prefix KV-cache simulator with learned, session-aware eviction"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pacer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "decision"
harness = false
