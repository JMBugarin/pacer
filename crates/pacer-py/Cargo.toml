[package]
name = "pacer-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pacer = { path = "../pacer" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
