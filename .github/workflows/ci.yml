name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      PACER_BIN: ${{ github.workspace }}/target/release/pacer
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p pacer

      - name: release build
        run: cargo build --release -p pacer

      - name: libomp for lightgbm
        if: runner.os == 'macOS'
        run: brew install libomp

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --locked --group dev

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest -m "not slow and not live"
